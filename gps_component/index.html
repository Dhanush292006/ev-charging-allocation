<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <script src="https://unpkg.com/streamlit-component-lib@2.0.0/dist/index.js"></script>
  <style>
    body { margin: 0; font-family: sans-serif; }
    button { border: 1px solid #0d7773; border-radius: 5px; background: #0d7773; color: white; cursor: pointer; font-size: 14px; padding: 9px 14px; }
    button:disabled { cursor: wait; opacity: .65; }
    #status { color: #596866; font-size: 13px; margin-left: 10px; }
  </style>
</head>
<body>
  <button id="locate" type="button">Get my location</button><span id="status"></span>
  <script>
    const button = document.querySelector('#locate');
    const status = document.querySelector('#status');

    function send(value) {
      Streamlit.setComponentValue(value);
    }

    function locate() {
      if (!navigator.geolocation) {
        status.textContent = 'GPS is not supported by this browser.';
        send({ error: 'GPS is not supported by this browser.' });
        return;
      }
      button.disabled = true;
      status.textContent = 'Requesting permission...';
      navigator.geolocation.getCurrentPosition(
        (position) => {
          const coordinates = position.coords;
          status.textContent = `Accuracy +/-${Math.round(coordinates.accuracy)} m`;
          send({
            latitude: coordinates.latitude,
            longitude: coordinates.longitude,
            accuracy: coordinates.accuracy
          });
          button.disabled = false;
        },
        (error) => {
          const messages = {
            1: 'Location permission was denied. Allow location access and try again.',
            2: 'Your location could not be determined. Check device GPS and try again.',
            3: 'GPS timed out. Try again from a device with location enabled.'
          };
          const message = messages[error.code] || 'Unable to get your location. Try again.';
          status.textContent = message;
          send({ error: message });
          button.disabled = false;
        },
        { enableHighAccuracy: true, timeout: 30000, maximumAge: 0 }
      );
    }

    button.addEventListener('click', locate);
    Streamlit.setComponentReady();
    Streamlit.setFrameHeight(42);
  </script>
</body>
</html>
